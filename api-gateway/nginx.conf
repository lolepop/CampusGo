worker_processes auto;

events { worker_connections 1024; }

http {
    include /etc/nginx/conf.d/resolver.conf;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # PUBLIC LISTENER: only /public allowed
    server {
        listen 80;
        server_name public;

        location ~ ^/public/user/(.*)$ {
            set $target_user user_api;
            proxy_pass http://$target_user:3000/public/$1$is_args$args;
        }
        location /private/user/ {
            return 403;
        }

        location ~ ^/public/supplier/(.*)$ {
            set $target_supplier supplier_api;
            proxy_pass http://$target_supplier:3000/public/$1$is_args$args;
        }
        location /private/supplier/ {
            return 403;
        }

        location ~ ^/public/order/(.*)$ {
            set $target_order order_api;
            proxy_pass http://$target_order:3000/public/$1$is_args$args;
        }
        location /private/order/ {
            return 403;
        }

        location ~ ^/public/credit/(.*)$ {
            set $target_credit credit_api;
            proxy_pass http://$target_credit:3000/public/$1$is_args$args;
        }
        location /private/credit/ {
            return 403;
        }

        location / {
            return 403;
        }
    }

    # PRIVATE LISTENER: allow both /public and /private for internal service comms/testing
    server {
        listen 8080;
        server_name private;

        location ~ ^/public/user/(.*)$ {
            set $target_user user_api;
            proxy_pass http://$target_user:3000/public/$1$is_args$args;
        }
        location ~ ^/private/user/(.*)$ {
            set $target_user user_api;
            proxy_pass http://$target_user:3000/private/$1$is_args$args;
        }

        location ~ ^/public/supplier/(.*)$ {
            set $target_supplier supplier_api;
            proxy_pass http://$target_supplier:3000/public/$1$is_args$args;
        }
        location ~ ^/private/supplier/(.*)$ {
            set $target_supplier supplier_api;
            proxy_pass http://$target_supplier:3000/private/$1$is_args$args;
        }

        location ~ ^/public/order/(.*)$ {
            set $target_order order_api;
            proxy_pass http://$target_order:3000/public/$1$is_args$args;
        }
        location ~ ^/private/order/(.*)$ {
            set $target_order order_api;
            proxy_pass http://$target_order:3000/private/$1$is_args$args;
        }

        location ~ ^/public/credit/(.*)$ {
            set $target_credit credit_api;
            proxy_pass http://$target_credit:3000/public/$1$is_args$args;
        }
        location ~ ^/private/credit/(.*)$ {
            set $target_credit credit_api;
            proxy_pass http://$target_credit:3000/private/$1$is_args$args;
        }

        location = /grafana {
            absolute_redirect off;
            return 301 /grafana/$is_args$args;
        }

        location /grafana/ {
            set $target_grafana grafana;
            proxy_pass http://$target_grafana:3000$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /rabbitmq {
            absolute_redirect off;
            return 301 /rabbitmq/$is_args$args;
        }

        location /rabbitmq/ {
            set $target_rabbitmq rabbitmq;
            proxy_pass http://$target_rabbitmq:15672$request_uri;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
