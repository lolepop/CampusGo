networks:
  public_net:
  private_net:
    # internal: true

services:
  # metrics pipeline: service pushes to otel-collector. prometheus ingests metrics from collector and collector exports traces to tempo. grafana is a unified dashboard to show both
  tempo:
    image: grafana/tempo:3.1.1
    working_dir: /var/tempo
    command: ["-target=all", "-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    networks: [private_net]

  otel-collector:
    image: otel/opentelemetry-collector:0.163.0-nightly.ea6d627
    command: ["--config=/etc/otelcol/config.yaml"]
    mem_limit: 256m
    depends_on:
      tempo:
        condition: service_started
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:9464:9464"
      - "127.0.0.1:13133:13133"
    networks: [private_net]

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      otel-collector:
        condition: service_started
    networks: [private_net]

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
    networks: [private_net]

  # reverse proxy for backend api routing
  api_gateway:
    build:
      context: ./api-gateway
    # restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8081:8080" # exposes private endpoint for testing, should not be visible to public
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - public_net
      - private_net

  edge_dev:
    build:
      context: ./edge
    profiles: ["dev"]
    ports:
      - "8000:80"
    volumes:
      - ./edge/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - public_net

  # frontend
  frontend_dev:
    build:
      context: ./frontend
      target: development
      network: host
    profiles: ["dev"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - public_net
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}

  # event queue
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:5672:5672" # amqp
      - "127.0.0.1:15672:15672" # management ui
    networks: [private_net]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '-rabbitmq_management path_prefix "/rabbitmq"'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./observability/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro

  # user service
  user_db:
    image: postgres:18-alpine
    container_name: user_postgres_db
    # restart: always
    networks: [private_net]
    environment:
      POSTGRES_PASSWORD: ${USER_DB_PW}
      POSTGRES_DB: users
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - user_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d users"]
      interval: 2s
      timeout: 3s
      retries: 15
  user_dev:
    build:
      context: ./user-service
      target: development
      network: host
    profiles: ["dev"]
    ports:
      - "127.0.0.1:8001:3000"
    volumes:
      - ./user-service:/app
      - /app/node_modules
    networks:
      private_net:
        aliases:
          - user_api
    depends_on:
      user_db:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      NODE_ENV: development
      DATABASE_URL: ${USER_DB_URL}
      OTEL_DENO: "true"
      OTEL_DENO_METRICS: ${OTEL_METRICS:-true}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-10000}
      OTEL_SERVICE_NAME: user-service
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=campusgo,deployment.environment.name=development
      OTEL_PROPAGATORS: tracecontext
      OTEL_TRACES_SAMPLER: parentbased_always_on
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_HEADERS:-}
      OTEL_DENO_CONSOLE: ignore
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL}
      RABBITMQ_CONNECTION: ${RABBITMQ_CONNECTION}
    # command: deno task dev
    # workaround for docker in wsl
    command: sh -c "deno task db:update_dev && exec deno run -A https://deno.land/x/denon/denon.ts dev"
  user_prod:
    build:
      context: ./user-service
      target: production
      network: host
    profiles: ["prod"]
    networks:
      private_net:
        aliases:
          - user_api
    depends_on:
      user_db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${USER_DB_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL}
      RABBITMQ_CONNECTION: ${RABBITMQ_CONNECTION}

  # supplier service
  supplier_db:
    image: postgres:18-alpine
    container_name: supplier_postgres_db
    networks: [private_net]
    environment:
      POSTGRES_PASSWORD: ${SUPPLIER_DB_PW}
      POSTGRES_DB: suppliers
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - supplier_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d suppliers"]
      interval: 2s
      timeout: 3s
      retries: 15
  supplier_dev:
    build:
      context: ./supplier-service
      target: development
      network: host
    profiles: ["dev"]
    ports:
      - "127.0.0.1:8002:3000"
    volumes:
      - ./supplier-service:/app
      - /app/node_modules
      - ./data/csv:/seed:ro
    networks:
      private_net:
        aliases:
          - supplier_api
    depends_on:
      supplier_db:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      NODE_ENV: development
      OTEL_DENO: "true"
      OTEL_DENO_METRICS: ${OTEL_METRICS:-true}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-10000}
      OTEL_SERVICE_NAME: supplier-service
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=campusgo,deployment.environment.name=development
      OTEL_PROPAGATORS: tracecontext
      OTEL_TRACES_SAMPLER: parentbased_always_on
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_HEADERS:-}
      OTEL_DENO_CONSOLE: ignore
      DATABASE_URL: ${SUPPLIER_DB_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    # sync the schema, import the seed csv (skips suppliers that already exist, so
    # reruns are safe), then start with denon (workaround for docker in wsl).
    # seeded rows are credited to user 1; a failed seed does not block startup
    command: >
      sh -c "deno task db:update_dev &&
             (deno run -A src/tasks/seedSuppliers.ts /seed/supplier-seed-data.csv --actor-id=1 || echo 'supplier seed failed, continuing') &&
             exec deno run -A https://deno.land/x/denon/denon.ts dev"
  supplier_prod:
    build:
      context: ./supplier-service
      target: production
      network: host
    profiles: ["prod"]
    networks:
      private_net:
        aliases:
          - supplier_api
    depends_on:
      supplier_db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${SUPPLIER_DB_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}

  # order service
  order_db:
    image: postgres:18-alpine
    container_name: order_postgres_db
    networks: [private_net]
    environment:
      POSTGRES_PASSWORD: ${ORDER_DB_PW}
      POSTGRES_DB: orders
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - order_pgdata:/var/lib/postgresql
    # lets order_dev wait until postgres accepts connections before syncing the schema
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d orders"]
      interval: 2s
      timeout: 3s
      retries: 15
  order_dev:
    build:
      context: ./order-service
      target: development
      network: host
    profiles: ["dev"]
    ports:
      - "127.0.0.1:8004:3000"
    volumes:
      - ./order-service:/app
      - /app/node_modules
    networks:
      private_net:
        aliases:
          - order_api
    depends_on:
      order_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      NODE_ENV: development
      OTEL_DENO: "true"
      OTEL_DENO_METRICS: ${OTEL_METRICS:-true}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-10000}
      OTEL_SERVICE_NAME: order-service
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=campusgo,deployment.environment.name=development
      OTEL_PROPAGATORS: tracecontext
      OTEL_TRACES_SAMPLER: parentbased_always_on
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_HEADERS:-}
      OTEL_DENO_CONSOLE: ignore
      DATABASE_URL: ${ORDER_DB_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      RABBITMQ_CONNECTION: ${RABBITMQ_CONNECTION}
    # sync the schema, then start with denon (workaround for docker in wsl)
    command: sh -c "deno task db:update_dev && deno run -A https://deno.land/x/denon/denon.ts dev"
  order_prod:
    build:
      context: ./order-service
      target: production
      network: host
    profiles: ["prod"]
    networks:
      private_net:
        aliases:
          - order_api
    depends_on:
      order_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${ORDER_DB_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      RABBITMQ_CONNECTION: ${RABBITMQ_CONNECTION}

  # credit service database
  credit_db:
    image: postgres:18-alpine
    container_name: credit_postgres_db
    networks:
      private_net:
        aliases:
          - credit
    environment:
      POSTGRES_PASSWORD: ${CREDIT_DB_PW}
      POSTGRES_DB: credit
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - credit_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d credit"]
      interval: 5s
      timeout: 5s
      retries: 10

  credit_dev:
    command: sh -c "deno task db:update_dev && exec deno run -A --watch src/index.ts"
    build:
      context: ./credit-service
      target: development
    profiles: ["dev"]
    ports:
      - "127.0.0.1:8003:3000"
    volumes:
      - ./credit-service:/app
      - /app/node_modules
    networks:
      private_net:
        aliases:
          - credit_api
    depends_on:
      rabbitmq:
        condition: service_healthy
      credit_db:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      NODE_ENV: development
      OTEL_DENO: "true"
      OTEL_DENO_METRICS: ${OTEL_METRICS:-true}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-10000}
      OTEL_SERVICE_NAME: credit-service
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=campusgo,deployment.environment.name=development
      OTEL_PROPAGATORS: tracecontext
      OTEL_TRACES_SAMPLER: parentbased_always_on
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_HEADERS:-}
      OTEL_DENO_CONSOLE: ignore
      PORT: "3000"
      DATABASE_URL: postgresql://postgres:${CREDIT_DB_PW}@credit_db:5432/credit
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      RABBITMQ_CONNECTION: ${RABBITMQ_CONNECTION}

  credit_prod:
    build:
      context: ./credit-service
      target: production
    profiles: ["prod"]
    networks:
      private_net:
        aliases:
          - credit_api
    depends_on:
      rabbitmq:
        condition: service_healthy
      credit_db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://postgres:${CREDIT_DB_PW}@credit_db:5432/credit
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      RABBITMQ_CONNECTION: ${RABBITMQ_CONNECTION}

volumes:
  user_pgdata:
  supplier_pgdata:
  order_pgdata:
  credit_pgdata:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  tempo_data:
